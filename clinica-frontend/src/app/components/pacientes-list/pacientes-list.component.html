<div class="container mat-elevation-z8">
  <div class="header">
    <h1>Lista de Pacientes</h1>
    <a mat-raised-button color="primary" routerLink="/pacientes/nuevo">
      <mat-icon>add</mat-icon>
      <span>Añadir Paciente</span>
    </a>
  </div>

  <table mat-table [dataSource]="pacientes">

    <!-- Columna Nombre Completo -->
    <ng-container matColumnDef="nombreCompleto">
      <th mat-header-cell *matHeaderCellDef> Nombre Completo </th>
      <td mat-cell *matCellDef="let paciente"> {{paciente.nombre}} {{paciente.apellidos}} </td>
    </ng-container>

    <!-- Columna CI -->
    <ng-container matColumnDef="ci">
      <th mat-header-cell *matHeaderCellDef> Cédula de Identidad </th>
      <td mat-cell *matCellDef="let paciente"> {{paciente.ci}} </td>
    </ng-container>

    <!-- Columna Celular -->
    <ng-container matColumnDef="celular">
      <th mat-header-cell *matHeaderCellDef> Celular </th>
      <td mat-cell *matCellDef="let paciente"> {{paciente.celular}} </td>
    </ng-container>

    <!-- Columna Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let paciente">
        <a mat-icon-button color="primary" [routerLink]="['/pacientes/editar', paciente.id]" title="Editar">
          <mat-icon>edit</mat-icon>
        </a>
        <button mat-icon-button color="warn" (click)="deletePaciente(paciente.id)" title="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Mensaje si no hay datos -->
  <div *ngIf="!pacientes.length" class="no-data">
    No hay pacientes para mostrar.
  </div>
</div>
